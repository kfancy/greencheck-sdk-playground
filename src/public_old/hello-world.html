<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>GreenCheck SDK Hello World</title>
        <style type="text/css">
            .outputInfo {
                margin-top: 1em;
                border: 1px solid #aaa;
                padding: 8px;
                border-radius: 8px;
                font-size: 11px;
                width: 90%;
                min-height: 420px;
                height: fit-content;
            }
        </style>
    </head>
    <body>
        <h1>Run a handshake and CORS request to prove the SDK works.</h1>
        <div style="display: flex; gap: 1em; flex-direction: row">
            <button id="start-btn">Start, good init data 🎉</button>
            <button id="start-btn2">Start, bad Client ID</button>
            <button id="start-btn3">Start, bad auth server</button>
            <button id="pkce-test">Test PKCE</button>
        </div>

        <script type="module" src="/hw.js"></script>

        <div>
            <textarea id="output" name="output" class="outputInfo"></textarea>
        </div>
    </body>
